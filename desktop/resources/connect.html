<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接你的知君</title><link rel="stylesheet" href="connect.css"></head><body><main><span class="seal">知</span><p class="eyebrow">CONTEXT OF ME</p><h1>你的知君，就在这里。</h1><p class="intro">首次连接后，以后会自动找到你的私人空间。</p><section><span id="dot"></span><div><h2 id="name">正在寻找服务…</h2><p id="status" role="status">请确认笔记本与服务器连接到同一个局域网。</p></div></section><button id="enter" disabled>正在寻找…</button><details><summary>找不到服务器？</summary><p>检查服务器已开机、服务已启动，且两台电脑可以互相访问。也可以输入备用地址；身份仍会验证。</p><form id="address-form"><label for="address">服务器地址</label><input id="address" type="url" placeholder="https://你的Mac.local:28733" required><button type="submit">尝试连接</button></form><p id="error" role="alert"></p></details><details id="remote-panel" open><summary>在外也能连接</summary><p id="remote-status">远程访问尚未配对；局域网连接可正常使用。</p><form id="remote-form"><label for="pair-code">配对码</label><textarea id="pair-code" rows="3" placeholder="粘贴服务管理员提供的一次性配对码" required></textarea><button id="pair-button" type="submit">绑定远程连接</button> <button id="forget" type="button" hidden>取消本机配对</button></form><p id="remote-error" role="alert"></p></details><footer>对话、记忆与知识库保存在你的服务器上。</footer></main><script src="connect.js"></script></body></html>
