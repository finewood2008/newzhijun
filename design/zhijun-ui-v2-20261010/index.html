<!doctype html>
<!--
  OD web-prototype seed.

  Copy this file to <project>/index.html, then fill `<main id="content">` by
  pasting blocks from `references/layouts.md`. Every class referenced in
  layouts.md is defined here — DO NOT remove unused ones unless you also
  remove their callers, and DO NOT invent new global classes (use inline
  style="…" for one-off tweaks).

  Theme tokens at the top of `<style>` are the *only* place to set palette
  and type. They map cleanly onto a DESIGN.md — when an active design system
  is injected, swap these six variables and everything reflows.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知君 · 每一面，都属于你</title>
  <style>
    /* ─── tokens ─────────────────────────────────────────────────────────
       Six variables. Bind them to the active DESIGN.md and stop.
       Do not introduce raw hex anywhere else in this file. */
    :root {
      --bg:      #fafaf7;   /* page background — never #fff */
      --surface: #ffffff;   /* cards, modals, raised areas */
      --fg:      #1a1916;   /* primary text — never #000 */
      --muted:   #6b6964;   /* secondary text, captions */
      --border:  #e8e5df;   /* hairlines, dividers */
      --accent:  #c96442;   /* one accent — used at most 2× per screen */

      /* derived — do not change */
      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      /* type — display = serif (default), body = sans, mono for numerics */
      --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Times New Roman', serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      /* scale — clamp() so it works at 1280, 1440, 1920 without media queries */
      --fs-h1: clamp(44px, 6vw, 76px);
      --fs-h2: clamp(32px, 4vw, 48px);
      --fs-h3: 22px;
      --fs-lead: 19px;
      --fs-body: 16px;
      --fs-meta: 13px;

      /* spacing — 8-point grid */
      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --gap-xl: 56px;
      --gap-2xl: 96px;
      --container: 1120px;
      --gutter: 32px;

      --radius: 10px;
      --radius-lg: 16px;
    }

    /* ─── reset & base ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.55;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    p { text-wrap: pretty; }
    h1, h2, h3, h4 { text-wrap: balance; }

    /* ─── layout primitives ─────────────────────────────────────────── */
    .container {
      max-width: var(--container);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }
    .section {
      padding-block: clamp(48px, 8vw, var(--gap-2xl));
    }
    .section + .section { border-top: 1px solid var(--border); }
    .stack { display: flex; flex-direction: column; }
    .stack > * + * { margin-top: var(--gap-md); }
    .row { display: flex; align-items: center; gap: var(--gap-md); }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap-lg); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap-lg); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap-md); }
    .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap-xl); align-items: start; }
    .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: var(--gap-xl); align-items: start; }
    @media (max-width: 920px) {
      .grid-2, .grid-3, .grid-4, .grid-2-1, .grid-1-2 { grid-template-columns: 1fr; }
    }

    /* ─── type ──────────────────────────────────────────────────────── */
    .h1, h1 { font-family: var(--font-display); font-size: var(--fs-h1); line-height: 1.04; letter-spacing: -0.02em; margin: 0; }
    .h2, h2 { font-family: var(--font-display); font-size: var(--fs-h2); line-height: 1.1; letter-spacing: -0.015em; margin: 0; }
    .h3, h3 { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; margin: 0; }
    .lead   { font-size: var(--fs-lead); line-height: 1.55; color: var(--muted); max-width: 60ch; margin: 0; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 var(--gap-md);
    }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* ─── chrome: nav + footer ──────────────────────────────────────── */
    .topnav {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in oklch, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topnav-inner { display: flex; align-items: center; justify-content: space-between; padding-block: 14px; }
    .topnav .logo { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
    .topnav nav { display: flex; gap: var(--gap-lg); }
    .topnav nav a { font-size: 14px; color: var(--muted); }
    .topnav nav a:hover { color: var(--fg); }
    .pagefoot { padding-block: var(--gap-xl); color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }
    .pagefoot .row-between { flex-wrap: wrap; gap: var(--gap-md); }

    /* ─── buttons ───────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.005em;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 88%, black); }
    .btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--fg); }
    .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; padding-inline: 8px; }
    .btn-ghost:hover { color: var(--accent); }
    .btn-arrow::after { content: '→'; transition: transform 0.15s ease; }
    .btn-arrow:hover::after { transform: translateX(2px); }

    /* ─── card / surface ────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
    }
    .card-flat { background: transparent; border: 0; padding: 0; }
    .card-rule { background: transparent; border: 0; border-top: 1px solid var(--fg); padding: 24px 0 0; border-radius: 0; }

    /* ─── feature cell (icon + h3 + p) ──────────────────────────────── */
    .feature .feature-mark {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--accent);
      margin-bottom: var(--gap-md);
    }
    .feature .feature-mark svg { width: 18px; height: 18px; }
    .feature h3 { margin-bottom: 6px; }
    .feature p  { margin: 0; color: var(--muted); font-size: 15px; }

    /* ─── stat (big number + label) ─────────────────────────────────── */
    .stat .stat-num {
      font-family: var(--font-display);
      font-size: clamp(56px, 8vw, 96px);
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--accent);
      font-weight: 600;
    }
    .stat .stat-label { color: var(--muted); font-size: 14px; margin-top: 8px; max-width: 24ch; }
    .stat .stat-unit  { font-size: 0.5em; opacity: 0.7; margin-left: 2px; }

    /* ─── quote / testimonial ───────────────────────────────────────── */
    .quote {
      font-family: var(--font-display);
      font-size: clamp(24px, 2.6vw, 32px);
      line-height: 1.32;
      letter-spacing: -0.01em;
      max-width: 28ch;
    }
    .quote-author { color: var(--muted); font-size: 14px; margin-top: var(--gap-md); }
    .quote-mark   {
      font-family: var(--font-display);
      font-size: 140px; line-height: 0.7;
      color: var(--accent); opacity: 0.18;
      margin-bottom: -28px;
    }

    /* ─── pill / badge / tag ────────────────────────────────────────── */
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .tag {
      display: inline-flex; align-items: center;
      padding: 4px 10px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
    }

    /* ─── form field ────────────────────────────────────────────────── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--muted); }
    .input, .textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--fg);
      font: inherit;
      font-size: 15px;
    }
    .input:focus, .textarea:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .textarea { min-height: 96px; resize: vertical; line-height: 1.55; }

    /* ─── table (data-style, no chrome) ─────────────────────────────── */
    .ds-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ds-table th, .ds-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    .ds-table th { color: var(--muted); font-weight: 500; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
    .ds-table tbody tr:hover { background: var(--fg-soft); }
    .ds-table .num-col { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

    /* ─── image placeholder (DS-tinted block, never broken <img>) ──── */
    .ph-img {
      background:
        linear-gradient(135deg, var(--accent-soft), var(--fg-soft)),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      aspect-ratio: 16 / 10;
      display: grid; place-items: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    .ph-img.square    { aspect-ratio: 1 / 1; }
    .ph-img.portrait  { aspect-ratio: 3 / 4; }
    .ph-img.wide      { aspect-ratio: 16 / 9; }

    /* ─── divider ───────────────────────────────────────────────────── */
    .rule  { border: 0; border-top: 1px solid var(--border); margin: 0; }
    .rule-strong { border: 0; border-top: 1px solid var(--fg); margin: 0; }

    /* ─── hero variants used by layouts.md ──────────────────────────── */
    .hero          { padding-block: clamp(80px, 12vw, 160px); }
    .hero-center   { text-align: center; max-width: 32ch; margin-inline: auto; }
    .hero h1       { margin-bottom: var(--gap-md); }
    .hero .lead    { margin-bottom: var(--gap-lg); }
    .hero-cta      { display: inline-flex; gap: var(--gap-sm); flex-wrap: wrap; }
    .hero-center .hero-cta { justify-content: center; }
    .hero-split    { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-2xl); align-items: center; }
    @media (max-width: 920px) { .hero-split { grid-template-columns: 1fr; } }

    /* ─── log row (newsletter, blog list, changelog) ────────────────── */
    .log-row { display: grid; grid-template-columns: 120px 1fr 100px; gap: var(--gap-lg); padding: 22px 0; border-top: 1px solid var(--border); align-items: baseline; }
    .log-row .meta { color: var(--muted); }
    .log-row h3 { font-size: 19px; }
    .log-row .pull { text-align: right; }

<script>
const $ = s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const icon=name=>`<svg aria-hidden="true"><use href="#${name}"/></svg>`;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initialRoles=[
 {id:'personal',name:'个人',description:'关于生活、感受，以及作为自己的我。',threads:['当我想慢一点的时候','关于最近的一次选择'],memories:[
 {id:'m1',text:'我希望留一些不被安排的时间，去感受日常。',kind:'生活方式',status:'本人确认',date:'示例 / 10.08',source:'“周末不用都安排好。散散步、做一顿饭，也算过得很好。”',origin:'当我想慢一点的时候',note:'你可以随时修正这条理解。'},
 {id:'m2',text:'重要的选择，我希望先弄清楚自己真正在意什么。',kind:'判断与选择',status:'本人修正',date:'示例 / 10.07',source:'“我并不是每次都想得很清楚。但重要的事，我想先问问自己在意什么。”',origin:'关于最近的一次选择',note:'这条理解在示例中由本人修正。'},
 {id:'m3',text:'独处对我而言，可能是一种恢复状态的方式。',kind:'正在形成的理解',status:'待确认',date:'示例 / 10.06',source:'“一个人在家待一会儿，不用解释什么，我就会放松下来。”',origin:'一段安静的时间',note:'这是一条候选理解，等待你判断是否贴近自己。'}],documents:[{name:'一封写给未来自己的信.md',type:'文字笔记',date:'示例资料',text:'这是原型里的示例资料。\n\n希望以后的我，在忙碌之外，也记得给自己留一点空间。\n\n它用来演示资料阅读界面，不代表你的真实资料。'}]},
 {id:'work',name:'工作',description:'工作中的我。在这里讨论工作、项目、团队与职业相关的事情，表达工作状态下的想法与判断。',threads:[],memories:[],documents:[]}
];
let roles=structuredClone(initialRoles),activeId='personal',view='chat',group='self',sub='overview',thread=null,settings={memory:true,mode:'idle',minutes:5,reading:'standard'};
try{const saved=JSON.parse(localStorage.getItem('zhijun-ui-v2-demo')||'null');if(saved?.roles?.length&&saved.roles.every(r=>typeof r.id==='string'&&typeof r.name==='string'&&Array.isArray(r.memories)&&Array.isArray(r.threads)&&Array.isArray(r.documents))){roles=saved.roles;activeId=roles.some(r=>r.id===saved.activeId)?saved.activeId:'personal';settings={...settings,...saved.settings};}}catch{}
const current=()=>roles.find(r=>r.id===activeId)||roles[0];
function save(){current().settings=structuredClone(settings);try{localStorage.setItem('zhijun-ui-v2-demo',JSON.stringify({roles,activeId,settings}));}catch{}}
let toastTimer;function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3200);}
const heading=(eyebrow,title,description,extra='')=>`<div class="page-heading"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p>${description}</p></div>${extra}</div>`;
function syncShell(){const role=current();$$('.role-name').forEach(n=>n.textContent=role.name);$('.role-select .role-letter').textContent=Array.from(role.name)[0];$('#page-name').textContent=({chat:'对话',memory:'记忆',library:'知识库',roles:'我的角色',settings:'设置'})[view];$$('[data-view]').forEach(n=>{n.classList.toggle('active',n.dataset.view===view);if(n.dataset.view===view)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');});$('#history-list').innerHTML=role.threads.length?role.threads.map((t,i)=>`<button data-thread="${i}" title="${esc(t)}">${esc(t)}</button>`).join(''):'<p class="history-empty">从这里开始，<br>留下一段新的相处。</p>';$('#content').classList.toggle('is-large',settings.reading==='large');}
function syncNavigation(){const mobile=matchMedia('(max-width:640px)').matches;$('.rail').inert=mobile&&!$('.workspace').classList.contains('menu-open');}window.addEventListener('resize',syncNavigation);
function render(){syncShell();syncNavigation();const content=$('#content');content.innerHTML=view==='chat'?chatPage():view==='memory'?memoryPage():view==='library'?libraryPage():view==='roles'?rolesPage():settingsPage();content.scrollTop=0;}
function go(next){view=next;$('.workspace').classList.remove('menu-open');render();history.replaceState(null,'','#'+next);}
function selectRole(id){if(!roles.some(r=>r.id===id))return;current().settings=structuredClone(settings);activeId=id;settings={memory:true,mode:'idle',minutes:5,reading:'standard',...current().settings};thread=null;group='self';sub='overview';save();closeDialog('role-dialog');go('chat');toast(`已进入「${current().name}」的独立空间`);}
function composer(){return `<form class="composer" id="chat-form"><textarea id="message-input" aria-label="对话内容" placeholder="有些话，想和你说说…" rows="2" maxlength="4000"></textarea><div class="composer-footer"><small>${icon('lock')}仅在「${esc(current().name)}」这个角色里相处</small><div><button type="button" class="icon-button" data-action="attach-chat" aria-label="添加本次参考附件">${icon('attach')}</button><button class="send" aria-label="发送演示对话">${icon('up')}</button></div></div></form>`;}
function chatPage(){const role=current();if(thread)return `<section class="section thread-reading" data-od-id="conversation"><div class="thread-date">${esc(role.name)} · 一段相处 / 示例演示</div><div class="user-bubble">${esc(thread)}</div><div class="assistant-note"><span>知君 / CONTEXT OF ME</span><p>我们可以慢慢说。<br>此刻，最让你想停下来想一想的是什么？</p><div class="demo-notice">这是界面中的演示回复。原型没有连接模型，所输入的内容不会发送到后台。</div></div>${composer()}</section>`;
return `<section class="section chat-home" data-od-id="chat-home"><div class="container"><div class="hero-split"><div><p class="eyebrow">A PLACE TO BE YOURSELF</p><h1>${role.id==='personal'?'见字如面。':`在「${esc(role.name)}」里。`}<br>今天，想从哪里说起？</h1><p class="lead">${role.id==='personal'?'那些还没理清的念头，值得被听见。<br>不必组织好语言，我们慢慢聊。':esc(role.description)}</p></div><aside class="margin-note"><div class="paper-mark" aria-hidden="true"><span>知</span></div><span>每一面，都属于你。</span><p>在不同的角色里，<br>表达可以有所不同。<br>每个空间，留下自己的记忆。</p><a href="#roles" data-view="roles">看看我的角色</a></aside></div>${composer()}<div class="chat-hints"><button data-prompt="最近，我在想一件事情。">最近在想的事 ↗</button><button data-prompt="今天有一点说不清的感受。">此刻的感受 ↗</button><button data-prompt="有一个选择，我想慢慢理清楚。">想理清的选择 ↗</button></div><div class="recent-block"><div class="section-cap"><span>留在「${esc(role.name)}」里的相处</span><span>示例预览</span></div><div class="recent-entries">${role.threads.length?role.threads.slice(0,2).map((t,i)=>`<button data-thread="${i}"><span>一段相处 / ${String(i+1).padStart(2,'0')}</span><strong>${esc(t)}</strong><p>回到那段对话，继续理解当时的自己。</p></button>`).join(''):`<div class="card-rule"><h3>这个空间，还没有故事。</h3><p class="reading-subtitle">从今天的一句话开始，慢慢留下属于这个角色的线索。</p></div>`}</div></div></div></section>`;}
const groups={self:{name:'认识自己',items:[['overview','概览'],['profile','用户画像'],['tree','记忆树']]},past:{name:'回看来处',items:[['diary','情绪日记'],['review','记忆沉淀'],['conversations','对话记录']]},care:{name:'相处方式',items:[['journal','整理记录'],['proactive','主动关心'],['memory-settings','记忆设置']]}};
function memoryRows(items){return `<div class="entry-list">${items.map(m=>`<article class="log-row"><div class="meta">${esc(m.kind)}<span class="entry-status">${esc(m.status)}</span></div><div><h3>${esc(m.text)}</h3><p>来自「${esc(m.origin)}」 · ${esc(m.date)}</p></div><button class="pull" data-memory="${esc(m.id)}">查看来处 ↗</button></article>`).join('')}</div>`;}
function memoryPage(){return `<section class="section" data-od-id="memory"><div class="container">${heading('THE THREADS OF YOU','那些被记住的你。','回看来处，修正理解。如何定义自己，始终由你决定。',`<div class="meta">${esc(current().name)}的记忆<br>每条理解，都有来处。</div>`)}<div class="memory-groups" role="tablist" aria-label="记忆分组">${Object.entries(groups).map(([id,g],i)=>`<button role="tab" aria-selected="${group===id}" class="${group===id?'active':''}" data-group="${id}"><span>0${i+1}</span>${g.name}</button>`).join('')}</div><div class="memory-layout"><nav class="memory-menu" aria-label="${groups[group].name}目录">${groups[group].items.map(([id,name])=>`<button data-sub="${id}" class="${sub===id?'active':''}" ${sub===id?'aria-current="page"':''}>${name}</button>`).join('')}<p>理解会随你变化。<br>你可以确认，也可以修正。</p></nav><div id="memory-reading">${memoryContent()}</div></div></div></section>`;}
function memoryContent(){const r=current(),mem=r.memories;if(sub==='memory-settings')return memorySettings();if(sub==='proactive')return `<div class="reading-heading"><h2>以你舒服的方式相处。</h2></div><p class="reading-subtitle">主动关心的时间与频率，由你决定。</p><div class="setting-section"><div class="setting-heading"><div><h3>允许主动关心</h3><p>在合适的时刻，轻轻问候，而不是催促。</p></div><label class="switch">开启<input type="checkbox" aria-label="允许主动关心"></label></div></div><div class="setting-section"><h3>安静时段</h3><p>这段时间，知君不主动打扰。</p><div class="setting-inline"><input type="time" value="22:00" aria-label="安静时段开始">至<input type="time" value="08:00" aria-label="安静时段结束"></div></div><button class="btn btn-primary" data-action="save-settings">保存相处方式</button>`;
if(!mem.length&&sub!=='conversations')return empty('每一页，从相处开始。','这里是这个角色独立的记忆空间。对话慢慢积累后，再回来看知君的理解。','开始一段对话','new-chat');
if(sub==='overview'||sub==='profile')return `<div class="reading-heading"><h2>${sub==='overview'?'关于你的几条线索。':'一幅可以修改的自画像。'}</h2><span class="meta">示例理解</span></div><p class="reading-subtitle">留下贴近自己的理解，把不准确的地方慢慢改正。</p><div class="portrait"><div><p class="portrait-quote">“我想认真地做选择，<br>也想给生活留一点余地。”</p><p class="portrait-copy">这句话来自本页的示例记忆。知君的理解应当有来源，<br>也始终为你的变化留出空间。</p><div class="memory-tags"><span class="tag">生活的节奏</span><span class="tag">判断与选择</span><span class="tag">与自己相处</span></div></div><aside class="portrait-margin"><b>理解，不是定论。</b>本人确认与候选理解<br>分别保留。<br>修正后仍可以回看来源。<a href="#" data-sub="tree">沿着记忆，看看来处 ↗</a></aside></div><div class="review-note"><span><b>还有理解，等你看看。</b><br>只有你知道，它是否真的贴近自己。</span><button data-sub="review">去确认 ${icon('arrow')}</button></div>${memoryRows(mem.filter(m=>m.status!=='待确认'))}<div class="summary-footer"><span>示例内容 · 不代表你的真实画像</span><button data-sub="tree">查看记忆树 ↗</button></div>`;
if(sub==='tree')return `<div class="reading-heading"><h2>顺着线索，看看自己。</h2></div><p class="reading-subtitle">按主题阅读记忆，每条理解都保留对话来源。</p>${memoryRows(mem)}`;
if(sub==='review'){const pending=mem.filter(m=>m.status==='待确认');return `<div class="reading-heading"><h2>这些理解，贴近你吗？</h2></div><p class="reading-subtitle">候选理解等待你的判断。确认之前，仍标注为“待确认”。</p>${pending.length?memoryRows(pending):empty('这一页，已经看过了。','当前原型没有等待确认的理解。','查看已有记忆','memory-tree')}`;}
if(sub==='conversations')return `<div class="reading-heading"><h2>回到那时的对话。</h2></div><p class="reading-subtitle">只展示当前「${esc(r.name)}」角色里的相处。</p>${r.threads.length?r.threads.map((t,i)=>`<article class="log-row"><span class="meta">一段相处</span><div><h3>${esc(t)}</h3><p>保留说过的话，让理解可以回到原文。</p></div><button class="pull" data-thread="${i}">回看 ↗</button></article>`).join(''):empty('还没有对话。','这个角色的相处，从下一句话开始。','开始对话','new-chat')}`;
if(sub==='diary')return `<div class="reading-heading"><h2>感受，也值得被记下。</h2></div><p class="reading-subtitle">情绪的来处与当时的表达放在一起，保留你自己的说法。</p><article class="log-row"><span class="meta">示例日记<br>一个周末</span><div><h3>不必把每个空隙都填满。</h3><p>“慢慢做了一顿饭，才发现今天其实很安静。”</p></div><button class="pull" data-memory="m1">查看来源 ↗</button></article>`;
return `<div class="reading-heading"><h2>理解如何，一点点留下。</h2></div><p class="reading-subtitle">回看每次整理的来处与状态。</p><article class="log-row"><span class="meta">示例记录</span><div><h3>从一段对话，到一条理解。</h3><p>整理完成 · 候选理解仍等待本人确认</p></div><button class="pull" data-sub="review">看看理解 ↗</button></article>`;
}
function empty(title,desc,cta,action){return `<div class="empty-state"><span class="role-letter">${esc(Array.from(current().name)[0])}</span><h2>${title}</h2><p>${desc}</p><button class="btn btn-secondary" data-action="${action}">${cta} ${icon('arrow')}</button></div>`;}
function libraryPage(){const r=current();return `<section class="section" data-od-id="library"><div class="container">${heading('YOUR LIBRARY','把值得留下的，放在这里。','你的文档、笔记与资料，也是知君理解你的线索。',`<button class="btn btn-primary" data-action="upload">${icon('plus')}添加资料</button>`)}<div class="library-search"><div class="search-field">${icon('search')}<input aria-label="搜索资料" id="library-search" placeholder="在「${esc(r.name)}」的资料里寻找…"></div><span class="meta" style="font-size:10px">${esc(r.name)}的知识库</span></div><div id="documents">${documentRows(r.documents)}</div><p class="quiet-note">${icon('lock')}这里的资料只属于「${esc(r.name)}」角色。添加新角色，不会复制已有资料。</p><input type="file" id="upload-input" multiple hidden></div></section>`;}
function documentRows(docs){return docs.length?docs.map((d)=>`<article class="document-row">${icon('file')}<div><h3>${esc(d.name)}</h3><p>${esc(d.type)} · 当前角色的参考资料</p></div><span class="meta">${esc(d.date)}</span><button data-document="${esc(d.name)}">阅读 ↗</button></article>`).join(''):empty('从一份熟悉的资料开始。','上传后，在这里查看阅读与整理状态。原型仅演示文件名称，不上传文件。','添加资料','upload');}
function rolesPage(){return `<section class="section" data-od-id="roles"><div class="container">${heading('THE DIFFERENT SIDES OF YOU','在不同的角色里，做自己。','工作时的判断，生活里的感受，都可以有各自的表达空间。')}<p class="roles-intro">每个角色沿用同一套知君能力，拥有独立的定位、对话、记忆与资料。<br>它们都是你的侧面，由你来定义如何相处。</p>${roles.map((r,i)=>`<article class="role-row"><span class="num">${String(i+1).padStart(2,'0')}</span><div><h2>${esc(r.name)}${r.id===activeId?'<small>当前角色</small>':''}</h2><p>${esc(r.description)}</p><div class="role-scope"><span>独立对话</span><span>独立记忆</span><span>独立资料</span></div></div><button data-role="${esc(r.id)}">${r.id===activeId?'回到相处':'进入角色'}${icon('arrow')}</button></article>`).join('')}<div class="roles-footer"><p>新的角色，从空白开始。<br>已有的故事，留在原来的空间里。</p><button class="btn btn-primary" data-action="create-role">${icon('plus')}定义新的角色</button></div></div></section>`;}
function memorySettings(){return `<div class="reading-heading"><h2>让记忆，以合适的节奏留下。</h2></div><p class="reading-subtitle">这些设置只用于当前「${esc(current().name)}」的记忆空间。</p><div class="setting-section"><div class="setting-heading"><div><h3>存储记忆</h3><p>允许知君使用已有记忆，并从对话中积累新的理解。</p></div><label class="switch">${settings.memory?'已开启':'已关闭'}<input id="memory-enabled" type="checkbox" aria-label="存储记忆" ${settings.memory?'checked':''}></label></div></div><div class="setting-section"><h3>何时整理对话</h3><p>给表达留出完整的时间，再整理其中的线索。</p><div class="option-pair"><label><input name="extract-mode" type="radio" value="idle" ${settings.mode==='idle'?'checked':''}><span>对话空闲后整理<small>让一段相处先说完，再沉淀理解。</small></span></label><label><input name="extract-mode" type="radio" value="interval" ${settings.mode==='interval'?'checked':''}><span>按固定间隔整理<small>按你设定的频率，定期回顾。</small></span></label></div><label class="setting-inline">等待<input type="number" min="1" max="120" id="idle-minutes" aria-label="等待分钟数" value="${Number(settings.minutes)||5}">分钟后整理</label></div><div class="settings-footer"><p>界面演示设置，不会修改真实记忆服务。</p><button class="btn btn-primary" data-action="save-settings">保存设置</button></div>`;}
function settingsPage(){return `<section class="section" data-od-id="settings"><div class="container">${heading('AT YOUR OWN PACE','以你舒服的方式相处。','记忆的节奏、阅读的字号，由你决定。')}<div class="settings-layout"><nav class="memory-menu setting-menu" aria-label="设置目录"><button class="active">相处与阅读</button><button data-action="open-memory-settings">记忆设置</button><button data-view="roles">角色定位</button></nav><div><div class="setting-section"><h3>阅读字号</h3><p>让长一些的理解，也能读得从容。</p><div class="reading-options"><button data-reading="standard" class="${settings.reading==='standard'?'active':''}">标准字号</button><button data-reading="large" class="${settings.reading==='large'?'active':''}">大一点</button></div><p style="margin:24px 0 0;font-family:var(--font-display);font-size:${settings.reading==='large'?22:18}px">“如何定义自己，始终由你决定。”</p></div>${memorySettings()}</div></div></div></section>`;}
function openDialog(id){const el=$('#'+id);if(!el.open){el._opener=document.activeElement;el.showModal();}}
function closeDialog(id){const el=$('#'+id);if(el.open){el.close();el._opener?.focus();}}
function roleDialog(){const role=current();$('#role-options').innerHTML=roles.map(r=>`<button class="role-option ${r.id===role.id?'is-current':''}" data-role="${esc(r.id)}"><span class="role-letter">${esc(Array.from(r.name)[0])}</span><div><b>${esc(r.name)}</b><p>${esc(r.description)}</p></div>${icon(r.id===role.id?'check':'arrow')}</button>`).join('');openDialog('role-dialog');}
function memoryDetail(id){const m=current().memories.find(m=>m.id===id);if(!m)return;$('#detail-title').textContent='理解的来处';$('#detail-body').innerHTML=`<span class="detail-status">${esc(m.status)}</span><p class="detail-text">${esc(m.text)}</p><div class="detail-section-label">原句 · ${esc(m.origin)} / 示例</div><blockquote class="source-block">${esc(m.source)}</blockquote><p class="reading-subtitle">${esc(m.note)}</p><div class="detail-edit" hidden><label class="field">写成更贴近你的说法<textarea class="textarea" id="memory-edit">${esc(m.text)}</textarea></label><button class="btn btn-secondary" data-save-memory="${esc(m.id)}" style="margin-top:15px">保存修正</button></div><div class="detail-actions">${m.status==='待确认'?`<button class="btn btn-primary" data-confirm-memory="${esc(m.id)}">这贴近我，确认</button>`:''}<button class="btn btn-secondary" data-action="edit-memory">修正这条理解</button><button class="btn btn-ghost" data-close="detail-dialog">先放在这里</button></div><div class="dialog-meta">示例中的操作只改变本原型，不改动你的真实记忆。</div>`;openDialog('detail-dialog');}
function documentDetail(name){const d=current().documents.find(d=>d.name===name);if(!d)return;$('#detail-title').textContent=d.name;$('#detail-body').innerHTML=`<div class="detail-section-label">${esc(d.type)} · ${esc(current().name)}的资料</div><p class="source-block" style="white-space:pre-wrap;border:0;padding-left:0">${esc(d.text)}</p><div class="dialog-meta">资料阅读界面预览</div>`;openDialog('detail-dialog');}
document.addEventListener('click',e=>{if(!(e.target instanceof Element))return;if(e.target.matches('.workspace.menu-open')&&e.clientX>236){$('.workspace').classList.remove('menu-open');syncNavigation();return;}const b=e.target.closest('button,a');if(!b)return;
 if(b.dataset.view){e.preventDefault();go(b.dataset.view);return;}
 if(b.dataset.close){closeDialog(b.dataset.close);return;}
 if(b.dataset.role){selectRole(b.dataset.role);return;}
 if(b.dataset.group){group=b.dataset.group;sub=groups[group].items[0][0];render();return;}
 if(b.dataset.sub){e.preventDefault();sub=b.dataset.sub;group=Object.keys(groups).find(id=>groups[id].items.some(([key])=>key===sub))||group;render();return;}
 if(b.dataset.memory){memoryDetail(b.dataset.memory);return;}
 if(b.dataset.document){documentDetail(b.dataset.document);return;}
 if(b.dataset.thread!==undefined){thread=current().threads[Number(b.dataset.thread)];go('chat');return;}
 if(b.dataset.prompt){$('#message-input').value=b.dataset.prompt;$('#message-input').focus();return;}
 if(b.dataset.confirmMemory){const m=current().memories.find(m=>m.id===b.dataset.confirmMemory);if(m){m.status='本人确认';m.note='这条示例理解已由你在原型中确认。';save();closeDialog('detail-dialog');render();toast('已确认这条示例理解');}return;}
 if(b.dataset.saveMemory){const m=current().memories.find(m=>m.id===b.dataset.saveMemory);const text=$('#memory-edit').value.trim();if(m&&text){m.text=text;m.status='本人修正';m.note='修正保留原句来源，方便回看。';save();closeDialog('detail-dialog');render();toast('已保存示例修正，原句来源仍保留');}return;}
 if(b.dataset.reading){settings.reading=b.dataset.reading;save();render();return;}
 switch(b.dataset.action){case 'switch':roleDialog();break;case 'menu':$('.workspace').classList.toggle('menu-open');syncNavigation();break;case 'create-role':closeDialog('role-dialog');$('#role-form').reset();$('#role-error').textContent='';openDialog('create-dialog');break;case 'new-chat':thread=null;go('chat');$('#message-input').focus();break;case 'memory-tree':group='self';sub='tree';render();break;case 'edit-memory':$('.detail-edit').hidden=false;$('#memory-edit').focus();break;case 'upload':$('#upload-input').click();break;case 'attach-chat':toast('附件入口预览：正式版可添加本次参考资料。');break;case 'open-memory-settings':group='care';sub='memory-settings';go('memory');break;case 'save-settings':settings.memory=$('#memory-enabled')?.checked??settings.memory;settings.mode=$('input[name="extract-mode"]:checked')?.value||settings.mode;settings.minutes=Math.max(1,Math.min(120,Number($('#idle-minutes')?.value)||5));save();toast('预览设置已保存，不影响正在使用的知君。');break;}
});
document.addEventListener('submit',e=>{if(e.target.id==='role-form'){e.preventDefault();const form=new FormData(e.target),name=String(form.get('name')).trim(),description=String(form.get('description')).trim();if(!name||!description)return;if(roles.some(r=>r.name===name)){$('#role-error').textContent='已有同名角色，请给它一个不同的名称。';return;}const id=crypto.randomUUID();roles.push({id,name,description,threads:[],memories:[],documents:[]});closeDialog('create-dialog');selectRole(id);toast(`「${name}」已在原型中创建，记忆从空白开始。`);}if(e.target.id==='chat-form'){e.preventDefault();const input=$('#message-input'),text=input.value.trim();if(!text){input.focus();return;}thread=text;const title=Array.from(text).slice(0,25).join('');current().threads.unshift(title);go('chat');/* Sending stays in memory until another demo preference is saved. */}});
document.addEventListener('input',e=>{if(e.target.id==='library-search'){const q=e.target.value.toLowerCase();const matches=current().documents.filter(d=>d.name.toLowerCase().includes(q));$('#documents').innerHTML=matches.length||!q?documentRows(matches):'<p class="reading-subtitle" style="padding:30px 0">没有匹配的资料，试试换一个词。</p>';}});
document.addEventListener('change',e=>{if(e.target.id==='upload-input'){const files=[...e.target.files];for(const file of files)current().documents.push({name:file.name,type:'本地文件名演示',date:'待接入服务',text:'此原型只记录了文件名称，未读取或上传文件内容。正式版将展示资料正文与处理状态。'});save();render();toast('已展示文件名。文件内容没有读取或上传。');}});
document.addEventListener('keydown',e=>{if(e.target.id==='message-input'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('#chat-form').requestSubmit();}if(e.target.getAttribute?.('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const keys=Object.keys(groups),i=keys.indexOf(group);group=keys[e.key==='Home'?0:e.key==='End'?keys.length-1:(i+(e.key==='ArrowRight'?1:-1)+keys.length)%keys.length];sub=groups[group].items[0][0];render();$(`[data-group="${group}"]`).focus();}if(e.key==='Escape'){$('.workspace').classList.remove('menu-open');syncNavigation();}});
$$('dialog').forEach(d=>{d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog(d.id);}});d.addEventListener('cancel',()=>d._opener?.focus());});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(['chat','memory','library','roles','settings'].includes(next)){view=next;render();}});
view=['chat','memory','library','roles','settings'].includes(location.hash.slice(1))?location.hash.slice(1):'chat';render();

</script>
</body>
</html>
